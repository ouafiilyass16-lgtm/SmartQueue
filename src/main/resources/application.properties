spring.application.name=SmartQueue

server.port=8080

# Base de donnees H2 persistante
spring.datasource.url=jdbc:h2:file:./data/smartqueue
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=SmartQueueSecretKeyForJwtAuthentication2026VeryLongSecret
jwt.expiration=86400000

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.boot.autoconfigure.security=DEBUG